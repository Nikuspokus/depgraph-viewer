name: Release

# À chaque push sur main : si la version du package.json n'a pas encore de release,
# on construit le .vsix et on crée la release (le tag vX.Y.Z est créé par GitHub).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire la version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cette version a-t-elle déjà une release ?
        id: exists
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.exists.outputs.exists == 'false'
        run: npm ci
      - if: steps.exists.outputs.exists == 'false'
        run: npm run typecheck

      - if: steps.exists.outputs.exists == 'false'
        run: npm test
      - if: steps.exists.outputs.exists == 'false'
        run: npm run package
      - if: steps.exists.outputs.exists == 'false'
        run: gh release create "v${{ steps.v.outputs.version }}" ./*.vsix dist/cli.js --target "$GITHUB_SHA" --title "v${{ steps.v.outputs.version }}" --generate-notes
